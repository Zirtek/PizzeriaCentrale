<!DOCTYPE html>
<html>
<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pizzeria_centrale">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pizzeria_centrale</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      let audioCtx = null;
      let isUnlocked = false;

      function getContext() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        return audioCtx;
      }

      // Sblocca l'audio su iOS Safari al primo tocco (es. inserimento PIN)
      function unlockAudio() {
        const ctx = getContext();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx.resume().catch(function () {});
        }

        if (!isUnlocked) {
          try {
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
            isUnlocked = true;
          } catch (_) {}
        }
      }

      ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(function (evt) {
        window.addEventListener(evt, unlockAudio, { passive: true });
      });

      function playTone(ctx, startTime, freq, duration, peakGain) {
        const oscMain = ctx.createOscillator();
        const oscHarm = ctx.createOscillator();
        const gain = ctx.createGain();

        oscMain.type = 'triangle';
        oscMain.frequency.setValueAtTime(freq, startTime);

        oscHarm.type = 'sine';
        oscHarm.frequency.setValueAtTime(freq * 2, startTime);

        const harmGain = ctx.createGain();
        harmGain.gain.setValueAtTime(0.35, startTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        oscMain.connect(gain);
        oscHarm.connect(harmGain);
        harmGain.connect(gain);
        gain.connect(ctx.destination);

        oscMain.start(startTime);
        oscHarm.start(startTime);
        oscMain.stop(startTime + duration + 0.02);
        oscHarm.stop(startTime + duration + 0.02);
      }

      window.PizzeriaAudio = {
        triggerAlert: async function (playSound) {
          if (navigator.vibrate) {
            try {
              navigator.vibrate([350, 150, 350, 150, 500]);
            } catch (_) {}
          }

          if (!playSound) return;

          try {
            const ctx = getContext();
            if (!ctx) return;
            if (ctx.state === 'suspended') {
              await ctx.resume();
            }

            const now = ctx.currentTime + 0.02;
            playTone(ctx, now, 987.77, 0.36, 0.9);
            playTone(ctx, now + 0.30, 783.99, 0.52, 0.95);
            playTone(ctx, now + 0.90, 987.77, 0.36, 0.9);
            playTone(ctx, now + 1.20, 783.99, 0.55, 0.95);
          } catch (_) {}
        }
      };
    })();
  </script>
</body>
</html>
