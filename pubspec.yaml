name: pizzeria_centrale
description: Gestionale completo per pizzeria con agenda, cucina, rider e compensi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.20.3
  url_launcher: ^6.3.0
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3 # o la versione più recente

flutter:
  uses-material-design: true

  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#EFE5D1"
    theme_color: "#EFE5D1"

